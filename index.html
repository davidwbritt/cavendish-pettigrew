<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reflective Aptitude Inventory, Form 4-B</title>
<style>
:root {
  --paper: #EDE8DA;
  --ink: #1A1712;
  --blue: #2E4A6B;
  --red: #E4002B;
  --rule: rgba(46, 74, 107, .25); /* --blue at 25% — kept as one token so retuning --blue can't leave this stale */
  /* Governs #app (the form/review flow) only — NOT .certificate, which
     hardcodes its own 400px max-width below regardless of this value, so
     the certificate stays fixed at portrait-phone-screenshot width no
     matter how wide the rest of the document gets. */
  --measure: 84ch;
  --serif: Georgia, Charter, 'Times New Roman', serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 17px; line-height: 1.5;
}
#app { max-width: var(--measure); margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.form-header {
  display: flex; gap: 2rem; border-bottom: 1px solid var(--blue);
  padding-bottom: .5rem; margin-bottom: 2rem;
}
.label {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .14em;
  color: var(--blue); text-transform: uppercase;
}
.field { display: flex; gap: .6rem; align-items: baseline; }
.field .value { font-family: var(--mono); font-size: .82rem; }
.question-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: .78rem; margin-bottom: 1.5rem;
}
.timer { display: flex; align-items: center; gap: .6rem; }
.timer-bar-fill { height: 1px; width: 100%; background: var(--ink); min-width: 60px; }
/* Digits only, below 10 displayed seconds (RED_THRESHOLD_MS, src/clock.js) —
   no transition/flash, the depletion bar stays untouched. */
.timer-digits-red { color: var(--red); }
.prompt { font-size: 1.06rem; margin: 0 0 2rem; white-space: pre-line; }
.options { display: flex; flex-direction: column; gap: .5rem; }
.option {
  display: flex; gap: .8rem; align-items: baseline; text-align: left;
  font: inherit; color: inherit; background: transparent;
  border: 1px solid var(--ink); padding: .7rem .9rem; cursor: pointer;
}
/* Hover/focus affordance — reads as "this is what you'd pick", never as a
   second full-black fill (that reading is reserved for aria-pressed="true"
   below). An inverted/thicker border, drawn via `outline` INSIDE the real
   1px border with a negative offset so it can never shift layout, and no
   transition (this project uses instant cuts throughout). Deliberately
   touches ONLY `outline`, never `background`/`color`, so it can never
   contest the black fill below regardless of cascade order — a
   hovered+selected option always still reads as selected, not merely
   hovered. `:focus-visible` gives keyboard takers the identical affordance.
   `.option-hover` is the SAME class the hoverDrift trick (src/ui/effects.js)
   applies to a decoy option, so a drifted highlight is pixel-identical to a
   real one. */
.option:hover, .option.option-hover, .option:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: -3px;
}
/* Suppresses the real hovered node's OWN native :hover ring while
   hoverDrift is steering the highlight onto its neighbour instead — higher
   specificity (two classes + a pseudo-class) than the plain `.option:hover`
   rule above, so it wins regardless of source order. */
.option.option-hover-off:hover { outline: none; }
.option[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.option-letter { font-family: var(--mono); font-size: .78rem; }
.forced-notice {
  font-family: var(--mono); font-weight: 700; font-size: .78rem;
  letter-spacing: .04em; color: var(--red); margin: 1.4rem 0 0;
}
/* The live scoring readout under the options during the post-commit hold
   (src/tally.js). Understated for the same reason the timer is (spec §4):
   it has to read as instrumentation the taker happens to be able to see,
   not as a display built for them. Muted blue is the form-furniture token,
   so it sits with the field labels and registration marks rather than
   competing with the question. No animation and no transition — it simply
   appears, which is what makes it feel logged rather than presented. */
.tally {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .02em;
  line-height: 1.5; color: var(--blue); margin: 1.6rem 0 0;
  padding-top: .5rem; border-top: 1px solid var(--rule);
}
/* Long enough on a narrow screen to need its own scroll rather than
   forcing the page wider or wrapping mid-figure. */
.tally-line { white-space: nowrap; overflow-x: auto; }
/* A ruled box, not a bare baseline. The field used to be borderless apart
   from an underline and stretched the full 84ch measure, which made its
   caret effectively invisible: an empty field puts the caret hard against
   its LEFT edge, so clicking anywhere in 666px of transparent nothing put a
   1px hairline somewhere the eye was not, with no box around it to anchor
   to. Boxed and capped at 24rem, the caret lands where a caret is expected.
   A ruled entry box is also what the form this imitates would actually have
   printed (spec §9) — the fix and the period register agree.

   `color` is set explicitly because `font: inherit` does NOT carry it:
   inputs do not inherit colour from their parent, so the field was
   rendering UA-default pure black (rgb(0,0,0)) rather than the warm --ink
   this document uses nowhere else but here. caret-color is named for the
   same reason — the caret follows `color`, and neither should be left to
   the user agent on the one screen that has to invite typing.

   font-size comes AFTER the `font: inherit` shorthand deliberately; the
   shorthand resets font-size, so reversing these two lines silently drops
   the larger text (and the taller, easier-to-see caret that comes with it). */
.name-input {
  font: inherit; font-size: 1.15rem;
  background: transparent; color: var(--ink); caret-color: var(--ink);
  border: 1px solid var(--ink); padding: .55rem .7rem;
  width: 100%; max-width: 24rem; margin-bottom: 0;
  /* Block, so BEGIN cannot ride up onto the same line. The field is capped
     at 24rem inside an 84ch measure, which left an inline-block button
     ample room to sit in the gap to its right. */
  display: block;
}
/* Breathing room between the field's caption and the box it captions. */
.subject-label { display: block; margin-bottom: .9rem; }
/* BEGIN on its own line, centred across the content column. */
.begin-row { text-align: center; margin-top: 2.75rem; }

/* The debrief's answer key. Plainer than the review sheet on purpose: the
   instrument has stopped performing by this point, so this is the one table
   in the document that is simply telling the truth. */
.key-table { margin-top: 1.5rem; }
.key-row { border-top: 1px solid var(--rule); padding: 1rem 0; }
.key-head {
  display: flex; gap: .8rem; align-items: baseline; flex-wrap: wrap;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
}
.key-n { font-weight: 700; }
.key-tick { color: var(--blue); }
.key-cross { color: var(--ink); opacity: .55; }
.key-none { color: var(--ink); opacity: .45; }
.key-prompt { margin: .5rem 0 .6rem; overflow-wrap: break-word; }
.key-line {
  display: flex; gap: .8rem; align-items: baseline;
  font-size: .92rem; margin-bottom: .2rem;
}
.key-label {
  font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
  color: var(--blue); flex: 0 0 8.5rem; text-transform: uppercase;
}
.key-value { overflow-wrap: break-word; }
/* The receipt for the three altered rows — the only saturated thing in the
   section, and the last line in its row, so it is where the eye stops. */
.key-falsified .key-label, .key-falsified .key-value { color: var(--red); }
.begin {
  font-family: var(--mono); font-size: .78rem; letter-spacing: .14em;
  background: var(--ink); color: var(--paper); border: 0; padding: .7rem 1.6rem; cursor: pointer;
}
.title { font-size: 1.5rem; font-weight: normal; margin: 0 0 .2rem; }
.subtitle { font-family: var(--mono); font-size: .78rem; color: var(--blue); margin: 0 0 2rem; }
body::before, body::after {
  content: ''; position: fixed; width: 14px; height: 14px; pointer-events: none;
  border-color: var(--blue); border-style: solid;
}
body::before { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
body::after { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }
.option.phantom-locked { opacity: .45; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .option { transform: none !important; }
}
body.cursor-hidden, body.cursor-hidden * { cursor: none !important; }
.synthetic-cursor {
  position: fixed; top: 0; left: 0; width: 0; height: 0; z-index: 9999;
  pointer-events: none;
  border-left: 9px solid var(--ink);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.review-row {
  padding: .9rem 0; border-bottom: 1px solid var(--rule); font-size: .86rem;
}
.review-row-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem .8rem;
}
.review-n, .review-time { font-family: var(--mono); font-size: .78rem; }
.refused {
  font-family: var(--mono); font-weight: 700; font-size: .64rem;
  letter-spacing: .12em; color: var(--red);
}
.review-row-head .edit { margin-left: auto; }
.review-prompt { margin: .5rem 0 .4rem; overflow-wrap: break-word; }
.review-answer {
  display: flex; gap: .5rem; align-items: baseline; margin: 0;
  padding-left: .9rem; border-left: 2px solid var(--rule);
}
.answer-letter {
  font-family: var(--mono); font-weight: 700; font-size: .82rem; flex: 0 0 auto;
}
.answer-text { min-width: 0; overflow-wrap: break-word; }
.edit {
  font-family: var(--mono); font-size: .64rem; letter-spacing: .1em;
  background: transparent; border: 1px solid var(--blue); color: var(--blue);
  padding: .15rem .4rem; cursor: pointer;
}
.correction {
  font-family: var(--mono); font-weight: 700; font-size: 1rem;
  color: var(--red); mix-blend-mode: multiply;
  transform: rotate(-2deg) translateY(1px); display: inline-block;
}
.correction.punch { animation: punch 350ms ease-out; }
@keyframes punch {
  0%   { transform: rotate(-2deg) scale(1.4); opacity: 0; }
  40%  { transform: rotate(-2deg) scale(1.4); opacity: 1; }
  100% { transform: rotate(-2deg) scale(1) translateY(1px); opacity: 1; }
}
.score-line { display: flex; gap: .8rem; align-items: baseline; margin: 1.5rem 0; }
.score-value { font-family: var(--mono); font-size: 1.3rem; }
.section-title { font-family: var(--mono); font-size: .8rem; letter-spacing: .16em; font-weight: 400; }
@media (prefers-reduced-motion: reduce) { .correction.punch { animation: none; } }
.certificate {
  max-width: 400px; margin: 0 auto; padding: 1.6rem 1.4rem;
  border: 1px solid var(--ink);
}
.cert-head { border-bottom: 1px solid var(--blue); padding-bottom: .8rem; margin-bottom: 1.2rem; }
.index-table { font-family: var(--mono); font-size: .7rem; margin: 1.4rem 0; }
.index-row { display: grid; grid-template-columns: 1fr auto 2.4rem; gap: .5rem; padding: .18rem 0; }
.index-row.suppressed { grid-template-columns: 1fr auto; }
.index-bar { letter-spacing: -1px; }
.index-score { text-align: right; }
.index-note { color: var(--blue); text-align: right; }
.interpretation { font-size: .92rem; }
.closer { margin-top: 1.6rem; }
.cert-foot {
  font-family: var(--mono); font-size: .64rem; color: var(--blue);
  border-top: 1px solid var(--blue); margin-top: 1.4rem; padding-top: .6rem;
}
.debrief-link {
  display: block; text-align: center; margin-top: 2.5rem;
  font-family: var(--mono); font-size: .66rem; color: var(--blue);
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
